# The main pipeline for earthquake_proj

resources:
  pipelines:
    earthquake_proj_etl:
      name: bronzeToSilver_cleaning
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/dlt_pipelines/bronze_to_silver_clean/transformations/**
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/dlt_pipelines/bronze_to_silver_clean/transformations



