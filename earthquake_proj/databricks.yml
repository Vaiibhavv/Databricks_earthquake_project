# This is a Databricks asset bundle definition for earthquake_proj.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: earthquake_proj
  uuid: eb00a3bf-cbb0-47cd-9809-8bf6676b9f66

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4913ee11-f47b.cloud.databricks.com
    variables:
      catalog: earthquake_proj
      schema: dev
      warehouse_id: fd9794e36f80d219
  prod:
    mode: production
    workspace:
      host: https://dbc-4913ee11-f47b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vaibhavsaner@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vaibhavsaner@gmail.com/prod/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: earthquake_proj
      schema: prod
      warehouse_id: fd9794e36f80d219
    permissions:
      - user_name: vaibhavsaner@gmail.com
        level: CAN_MANAGE
